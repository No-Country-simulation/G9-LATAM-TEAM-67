spring.application.name=backend
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:7200000}

# Clasificador externo
classifier.api.url=${CLASSIFIER_API_URL}
classifier.api.connect-timeout=${CLASSIFIER_CONNECT_TIMEOUT:3000}
classifier.api.read-timeout=${CLASSIFIER_READ_TIMEOUT:10000}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.devtools.restart.enabled=false
