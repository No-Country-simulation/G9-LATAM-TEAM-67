spring.application.name=backend
server.port=8080
# JWT
# Secreto JWT: usa la variable JWT_SECRET si existe, de lo contrario utiliza "hackathon" para desarrollo local.
jwt.secret=${JWT_SECRET:hackathon}
# CONFIGURACIÓN DE JPA / HIBERNATE
# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
# Formatear el SQL para facilitar su lectura
spring.jpa.properties.hibernate.format_sql=true
# Flyway será quien cree y administre las tablas
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=validate
# Desactiva Open Session in View (buena práctica)
spring.jpa.open-in-view=false
# CONFIGURACIÓN DE FLYWAY
# Ejecuta automáticamente las migraciones al iniciar la aplicación
spring.flyway.enabled=true
#
#==================== ORACLE ==============
spring.datasource.username=HACKATHON
spring.datasource.password=HackTeam672026
spring.datasource.url=jdbc:oracle:thin:@hackathondb_medium
#spring.datasource.url=jdbc:oracle:thin:@dbhackathon_tp?TNS_ADMIN=C:\Users\mahe2\OneDrive\Escritorio\G9-LATAM-TEAM-67\backend\src\main\resources\wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.flyway.baseline-on-migrate=true
#
spring.devtools.restart.enabled=false

#Configuracion HikariCp
spring.datasource.hikari.maximun-pool-size=10
spring.datasourse.hikari.minimun-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Detección de leaks
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
logging.level.com.zaxxer.hikari=DEBUG
# Propiedades Oracle
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=5000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=60000