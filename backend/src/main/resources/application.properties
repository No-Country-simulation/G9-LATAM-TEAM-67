spring.application.name=backend
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:7200000}

# Clasificador externo
classifier.api.url=${CLASSIFIER_API_URL}
classifier.api.connect-timeout=${CLASSIFIER_CONNECT_TIMEOUT:3000}
classifier.api.read-timeout=${CLASSIFIER_READ_TIMEOUT:10000}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=5000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=60000
logging.level.com.zaxxer.hikari=INFO

spring.devtools.restart.enabled=false
